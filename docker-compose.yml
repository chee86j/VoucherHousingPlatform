version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: vhp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vhp
      POSTGRES_PASSWORD: vhp_dev_password
      POSTGRES_DB: vhp_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vhp -d vhp_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for sessions and job queues
  redis:
    image: redis:7-alpine
    container_name: vhp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
